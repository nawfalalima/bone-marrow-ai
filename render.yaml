services:
  - type: web
    name: bone-marrow-ai
    runtime: python
    plan: free
    healthCheckPath: /
    buildCommand: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: MODEL_PATH
        value: /opt/render/project/src/model/bone_marrow_resnet18.pth
      - key: MODEL_DOWNLOAD_URL
        value: ""
